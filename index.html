<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/app.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Task Maker</title>
</head>
<body>
    <main>
        <section id="list">A</section>
        <section id="form">  
            <form id="taskForm" class="form-shell"> 
       <h1> Create a task</h1>
        <div class="mb-3">
            <label class="form-label" id="title">Title:</label>
            <input type="text" class="form-control"id="txtTitle">
        </div>
        <div class="mb-3">
            <label class="form-label" id="description">Description:</label>
            <textarea rows="3" class="form-control"id="descriptionInput"></textarea>
            
        </div>
        <div class="mb-3">
            <label class="form-label" id="color">Color:</label>
            <input type="color" class="form-control"id="selCol">
        </div>
        <div class="mb-3">
            <label class="form-label" id="date">Date:</label>
            <input type="datetime-local" class="form-control"id="dateTimeLocal">
        </div>
        <div class="mb-3">
            <label class="form-label" id="title"> Status:</label>
            <select class="form-control"id="selStatus">
                <option>New</option>
                <option>In Progress</option>
                <option>Completed</option>
                <option>Cancelled</option>
          </select>  
          <div class="mb-3">
            <label class="form-label" id="budget">Budget:</label>
            <input type="number" class="form-control"id="numBudget">
        </div>  
        <div class="mb-3">
            <button class="btn btn-dark"id="btnSave">Save</button>
        </div>  
    </div>
</form>   
        
        </section>


    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script> 
    <script src="./scripts/apps.js"></script>
</body>
</html>
